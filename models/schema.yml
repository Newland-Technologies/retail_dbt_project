version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_orders
    columns:
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'pending', 'cancelled']

  - name: fact_orders
    columns:
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
